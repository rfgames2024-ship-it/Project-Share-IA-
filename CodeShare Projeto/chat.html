<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="chat.css">
    <title>ProjectShare+</title>
</head>
<body>
    <header id="topBar">
        <div id="brandBlock">
            <div id="marca">ProjectShare+</div>
            <div id="accountEmail"></div>
        </div>
        <div id="topActions">
            <button id="historic" type="button"></button>
            <button id="logoutButton" type="button"></button>
        </div>
    </header>

    <main id="messages" aria-live="polite"></main>

    <div id="quadro">
        <input id="message" type="text" autocomplete="off">
        <button id="sending" type="button"></button>
    </div>

    <div id="profile">
        <div id="profilePhoto">X</div>
        <span id="profileName"></span>
    </div>

    <script src="chat.js"></script>
</body>
</html>
